services:
  postgres:
    image: postgres:18.3
    environment:
      POSTGRES_USER: ${POSTGRES_USR}
      POSTGRES_PASSWORD: ${POSTGRES_PSW}
  gateway:
    depends_on:
      - postgres
    build:
      context: .
      dockerfile: ./services/gateway/Dockerfile
      tags:
        - gsaplus-api:gateway
    environment:
      DATABASE_URL: postgres://${POSTGRES_USR}:${POSTGRES_PSW}@postgres/${POSTGRES_USR}
    ports:
      - 3001:3000
